[package]
name = "dynamic-island"
version = "0.1.0"
description = "Dynamic Island for PC"
authors = ["island"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
